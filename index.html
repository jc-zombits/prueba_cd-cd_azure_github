<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba CI/CD</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <header>
      <h1>Formulario de prueba</h1>
      <span id="version-badge" class="badge">v1.0.0</span>
    </header>

    <form id="contact-form" novalidate>
      <div class="field">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
        <small class="error" id="error-nombre"></small>
      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
        <small class="error" id="error-email"></small>
      </div>

      <div class="field">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje" required></textarea>
        <small class="error" id="error-mensaje"></small>
      </div>

      <button type="submit">Enviar</button>
    </form>

    <div id="resultado" class="resultado" hidden></div>

    <footer>
      <p>Último despliegue visto: <strong id="fecha-carga">—</strong></p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
